## IDF Component Manager Manifest File
dependencies:
  espressif/esp_wifi_remote:
    version: "0.14.*"
    
  espressif/esp_hosted:
    version: "1.4.*"

  espressif/esp-brookesia:
    version: "0.4.*"

  esp_video:
    version: "0.8.*"
    public: true

  espressif/esp_h264:
      version: "==1.0.3"
      public: true

  espressif/esp_websocket_client:
      version: "^1.3.0"
      public: true

  espressif/mdns:
      version: "^1.2.0"
      public: true

  # USB DISK (components/apps/hcc_home/HCCUsbDisk.cpp): thẻ SD -> USB Mass Storage qua OTG Full-Speed
  espressif/esp_tinyusb:
      version: "^2.3.0"

  # Music (components/apps/music_player/HCCMusicEngine.c): giải mã MP3/AAC/FLAC/M4A/OGG.
  # Không dùng gói esp-gmf vì gmf_io 1.1 đòi esp_codec_dev 2.0 beta, xung đột với BSP (~1.5).
  # Bản 2.6 cần ESP32-P4 rev >= 3.0 (sdkconfig: CONFIG_ESP32P4_REV_MIN_301=y).
  espressif/esp_audio_codec:
      version: "~2.6"

  # Avatar ảnh của Xiaozhi (components/apps/xiaozhi/XiaozhiPng.c): giải mã PNG trên thẻ SD.
  # Cùng bản đã có sẵn trong cây phụ thuộc (log build: espressif/libpng 1.6.58~2), không tải thêm.
  espressif/libpng:
      version: "^1.6.58"
